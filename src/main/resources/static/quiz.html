    function escapeLearningText(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        })[character]);
    }

    function showMode(mode) {
        activeMode = mode === "quiz" ? "quiz" : "knowledge";
        localStorage.setItem("knowledgeQuizMode", activeMode);
        document.getElementById("knowledgePanel").hidden = activeMode !== "knowledge";
        document.getElementById("quizPanel").hidden = activeMode !== "quiz";
        document.getElementById("knowledgeTab").classList.toggle("active", activeMode === "knowledge");
        document.getElementById("quizTab").classList.toggle("active", activeMode === "quiz");
        if (activeMode === "knowledge") {
            if (quizSubmitted) {
                loadRandomQuestions();
            }
            clearResultCountdown();
            renderCourseShelf();
        }
    }

    function renderCourseShelf() {
        const text = translations[currentLanguage];
        const shelf = document.getElementById("courseShelf");
        shelf.innerHTML = learningCourses.map(course => `
            <article class="course-book">
                <div class="course-icon">${course.icon}</div>
                <h3>${escapeLearningText(course.title[currentLanguage])}</h3>
                <p>${escapeLearningText(course.summary[currentLanguage])}</p>
                <button type="button" data-course-id="${course.id}">${text.readCourse}</button>
            </article>
        `).join("");
        shelf.querySelectorAll("[data-course-id]").forEach(button => {
            button.addEventListener("click", () => openCourse(button.dataset.courseId));
        });
        if (selectedCourseId) renderCourseReader();
    }

    function openCourse(courseId) {
        selectedCourseId = courseId;
        renderCourseReader();
        document.getElementById("courseReader").hidden = false;
    }

    function renderCourseReader() {
        const course = learningCourses.find(item => item.id === selectedCourseId);
        if (!course) return;
        const text = translations[currentLanguage];
        const reader = document.getElementById("courseReader");
        const chapters = course.chapters.map(chapter => `
            <section class="chapter-card">
                <h3>${escapeLearningText(chapter.title[currentLanguage])}</h3>
                <p>${escapeLearningText(chapter.text[currentLanguage])}</p>
            </section>
        `).join("");
        const resources = course.resources.map(resource => `
            <a href="${escapeLearningText(resource.url[currentLanguage])}" target="_blank" rel="noopener noreferrer">${escapeLearningText(resource.label[currentLanguage])} ↗</a>
        `).join("");
        reader.innerHTML = `
            <h2>${escapeLearningText(course.icon + " " + course.title[currentLanguage])}</h2>
            <h3>${text.chaptersLabel}</h3>
            <div class="chapter-grid">${chapters}</div>
            <h3>${text.furtherReading}</h3>
            <div class="resource-links">${resources}</div>
        `;
        reader.hidden = false;
    }

    function inferExistingCourse(index) {
        if ([1,3,4,17,18,26,27,36,38].includes(index)) return "theories";
        if ([5,6,7,20,21,25,29,33,34,35].includes(index)) return "herbs";
        if ([8,9,10,32].includes(index)) return "wellness";
        if ([13,16,23,24,30,31,39].includes(index)) return "diagnostics";
        if ([14,15,28].includes(index)) return "acupuncture";
        return "basics";
    }

    const questionCatalog = questionBank.map((question,index) => ({
        ...question,
        courseId:inferExistingCourse(index),
        difficulty:index < 15 ? "BRONZE" : index < 30 ? "SILVER" : "GOLD"
    })).concat(additionalCourseQuestions);

    let selectedQuestions = [];
    let quizSubmitted = false;
    let resultCountdownTimer = null;

    function clearResultCountdown() {
        if (resultCountdownTimer) {
            clearInterval(resultCountdownTimer);
            resultCountdownTimer = null;
        }
    }

    function getResultCountdownText(seconds) {
        if (currentLanguage === "zh") {
            return `成绩已保存，${seconds} 秒后自动跳转到知识学习板块。`;
        }
        if (currentLanguage === "ms") {
            return `Keputusan telah disimpan. Beralih ke Pembelajaran dalam ${seconds} saat.`;
        }
        return `Your result has been saved. Switching to Knowledge Learning in ${seconds} seconds.`;
    }

    function startResultCountdown() {
        clearResultCountdown();
        let seconds = 10;
        const countdownElement = document.getElementById("resultCountdown");
        if (!countdownElement) return;

        const updateCountdown = () => {
            countdownElement.textContent = getResultCountdownText(seconds);
        };

        updateCountdown();
        resultCountdownTimer = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearResultCountdown();
                showMode("knowledge");
                document.querySelector(".mode-switch").scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
                return;
            }
            updateCountdown();
        }, 1000);
    }

    function loadRandomQuestions() {
        clearResultCountdown();
        quizSubmitted = false;
        const resultBox = document.getElementById("result");
        resultBox.style.display = "none";
        resultBox.innerHTML = "";
        document.getElementById("submitBtn").disabled = false;

        selectedQuestions = questionCatalog
            .filter(question => question.difficulty === currentRank)
            .sort(() => Math.random() - 0.5)
            .slice(0, 10);

        const quizForm = document.getElementById("quizForm");
        quizForm.innerHTML = "";

        selectedQuestions.forEach((q, index) => {
            const card = document.createElement("div");
            card.className = "question-card";

            let optionsHtml = "";
            q.options[currentLanguage].forEach((option, optionIndex) => {
                optionsHtml += `
                    <label>
                        <input type="radio" name="q${index}" value="${optionIndex}">
                        ${option}
                    </label>
                `;
            });

            card.innerHTML = `
                <h3>${index + 1}. ${q.question[currentLanguage]}</h3>
                ${optionsHtml}
            `;

            quizForm.appendChild(card);
        });
    }

    async function loadLearningProgress() {
        try {
            const response = await fetch("/quiz/progress?username=" + encodeURIComponent(username));
            if (!response.ok) throw new Error(response.status);
            updateLearningProgress(await response.json());
        } catch (error) {
            console.error("Failed to load learning rank", error);
            updateLearningProgress(learningProgress);
        }
    }

    function updateLearningProgress(progress) {
        learningProgress = progress;
        currentRank = progress.rank || "BRONZE";
        renderRankBanner();
    }

    function renderRankBanner() {
        const t = translations[currentLanguage];
        const nextRank = currentRank === "BRONZE" ? "SILVER" : "GOLD";
        const nextText = currentRank === "GOLD"
            ? t.maxRank
            : t.nextRank
                .replace("{count}", learningProgress.correctNeeded)
                .replace("{rank}", t.rankNames[nextRank]);
        document.getElementById("rankBanner").textContent =
            `${t.rankLabel}: ${t.rankNames[currentRank]} · ${t.difficultyLabel}: ${t.difficultyNames[currentRank]} · ${t.totalCorrectLabel}: ${learningProgress.totalCorrect}. ${nextText}`;
    }

    function submitQuiz() {
        let score = 0;
        const topicStats = {};

        for (let i = 0; i < selectedQuestions.length; i++) {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);

            if (!selected) {
                alert(translations[currentLanguage].answerAlert);
                return;
            }

            const question = selectedQuestions[i];
            const courseStats = topicStats[question.courseId] || {correct:0,total:0};
            courseStats.total++;
            if (parseInt(selected.value) === question.answer) {
                score++;
                courseStats.correct++;
            }
            topicStats[question.courseId] = courseStats;
        }

        const total = selectedQuestions.length;
        const accuracy = Math.round((score / total) * 100);
        quizSubmitted = true;
        document.getElementById("submitBtn").disabled = true;

        const username = localStorage.getItem("username");

        fetch("/quiz/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                score: score,
                totalQuestions: total,
                accuracy: accuracy,
                topicStats: JSON.stringify(topicStats)
            })
        })
            .then(res => res.json())
            .then(data => {
                console.log("Quiz记录已保存:", data);
                const previousRank = currentRank;
                updateLearningProgress(data);
                if (previousRank !== currentRank) {
                    const language = translations[currentLanguage];
                    alert(language.rankUp.replace("{rank}", language.rankNames[currentRank]));
                }
            })
            .catch(err => {
                console.error("保存失败:", err);
            });

        localStorage.setItem("quizScore", score);
        localStorage.setItem("quizAccuracy", accuracy);
        localStorage.setItem("quizCompleted", "true");
        localStorage.setItem("completedTopics", "1");
        localStorage.setItem("learningProgress", accuracy >= 80 ? "60" : "40");

        let history = JSON.parse(localStorage.getItem("quizHistory")) || [];
        const now = new Date();

        history.push({
            date: now.toLocaleString(),
            accuracy: accuracy
        });

        if (history.length > 5) {
            history = history.slice(history.length - 5);
        }

        localStorage.setItem("quizHistory", JSON.stringify(history));

        const t = translations[currentLanguage];

        let comment = "";

        if (accuracy >= 80) {

            comment = t.excellent;

        } else if (accuracy >= 60) {

            comment = t.good;

        } else {

            comment = t.keepLearning;

        }

        const resultBox = document.getElementById("result");

        resultBox.style.display = "block";

        resultBox.innerHTML = `
<h2>${t.resultTitle}</h2>

<p>${t.score}: <b>${score} / ${total}</b></p>

<p>${t.accuracy}: <b>${accuracy}%</b></p>

<h3>${comment}</h3>

<div id="resultCountdown" class="result-countdown"></div>
`;
        resultBox.scrollIntoView({behavior: "smooth", block: "center"});
        startResultCountdown();
    }

    function changeLanguage(){

        currentLanguage =
            document.getElementById("languageSelect").value;

        localStorage.setItem(
            "language",

        );

        applyLanguage();

        loadRandomQuestions();

    }

    function logout() {
        localStorage.removeItem("username");
        window.location.href = "login.html";
    }

    function goKnowledgeLearning() {
        showMode("knowledge");
        document.querySelector(".mode-switch").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    document.getElementById("languageSelect").value =
        currentLanguage;

    async function initializeQuiz() {
        applyLanguage();
        showMode(activeMode);
        await loadLearningProgress();
        loadRandomQuestions();
    }
