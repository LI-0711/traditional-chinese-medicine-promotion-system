            padding-left:15px;

            margin-bottom:25px;

        h2{
            color:#2f5d50;
        }

        .card{
            background:#f7faf8;
            padding:15px;
            border-radius:10px;
            margin-top:15px;
        }

        button{
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2f7d68;
            color:white;
            cursor:pointer;
        }


        button:hover{
            background:#256855;
        }


        .grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .herb-card{
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 0 12px rgba(0,0,0,0.08);
            display:flex;
        }

        .herb-img{
            width:180px;
            height:250px;
            object-fit:cover;
        }

        .herb-content{
            padding:20px;
            flex:1;
        }

        .herb-content h3{
            margin:0;
            color:#2f5d50;
        }

        .category{
            display:inline-block;
            margin-top:8px;
            padding:5px 10px;
            border-radius:20px;
            background:#e6eee9;
            color:#2f5d50;
            font-size:13px;
        }

        .remove-btn{
            margin-top:15px;
            background:#d9534f;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;

    document.getElementById("languageSelect").value =
        currentLanguage;

    applyLanguage();

    loadQuizHistory();

    loadFavorites();

    function applyLanguage(){

        const t = translations[currentLanguage];

        document.documentElement.lang = currentLanguage;
        document.title = t.title;
        document.getElementById("languageSelect").value = currentLanguage;
        document.getElementById("welcomeUser").innerText = t.welcome;
        document.getElementById("logoutBtn").innerText = t.logout;
        document.getElementById("navHome").innerText = t.home;
        document.getElementById("navHerb").innerText = t.herbs;
        document.getElementById("navQuiz").innerText = t.quiz;
        document.getElementById("navHistory").innerText = t.history;
        document.getElementById("navPersonal").innerText = t.personal;
        document.getElementById("quizTitle").innerText = t.quizTitle;
        document.getElementById("favoriteTitle").innerText = t.favoriteTitle;
        renderQuizHistory();
        renderFavorites();

    }

    function loadQuizHistory(){

        fetch("/quiz/history?username=" + encodeURIComponent(username))
            .then(res => {
                if(!res.ok) throw new Error("Failed to load quiz history: " + res.status);
                return res.json();
            })
            .then(data => {
                quizRecords = data || [];
                renderQuizHistory();

            })
            .catch(error => {

                console.error(error);
                document.getElementById("quizHistory").innerHTML =
                    `<div class="card">${translations[currentLanguage].quizFailed}</div>`;

            });

    }

    function renderQuizHistory(){
        const t = translations[currentLanguage];
        const html = quizRecords.length === 0
            ? `<div class="card">${t.noQuiz}</div>`
            : quizRecords.map(record => `
                <div class="card">
                    ${t.score}: ${record.score}/${record.totalQuestions}<br>
                    ${t.accuracy}: ${record.accuracy}%
                </div>
            `).join("");
        document.getElementById("quizHistory").innerHTML = html;
    }

    function loadFavorites(){

        fetch("/favorite/list?username=" + encodeURIComponent(username))
            .then(res => {
                if(!res.ok) throw new Error("Failed to load favorites: " + res.status);
                return res.json();
            })
            .then(async data => {
                try {
                    const catalogResponse = await fetch("/data/herbs.json?v=20260702-1", {cache:"no-store"});
                    if(catalogResponse.ok) herbCatalog = await catalogResponse.json();
                } catch(error) {
                    console.warn("Herb catalog unavailable", error);
                }

                favoriteRecords = data || [];
                renderFavorites();

            })
            .catch(error => {

                console.error(error);

                document.getElementById("favoriteList").innerHTML =
                    `<div class="card">${translations[currentLanguage].favoritesFailed}</div>`;

            });

    }

    function escapeHtml(value){
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        })[character]);
    }

    function renderFavorites(){
        const t = translations[currentLanguage];

        if(favoriteRecords.length === 0){
            document.getElementById("favoriteList").innerHTML = `<div class="card">${t.noFavorites}</div>`;
            return;
        }

        const html = favoriteRecords.map(item => {
            const catalogHerb = herbCatalog.find(entry =>
                Object.values(entry.translations || {}).some(translation => translation.name === item.herbName)
            );
            const herb = catalogHerb?.translations?.[currentLanguage]
                || herbInfo[currentLanguage]?.[item.herbName]
                || {name:item.herbName, category:"", functions:"", usage:"", precautions:"", description:""};

            return `
                <div class="herb-card">
                    <div class="herb-content">
                        <h3>${escapeHtml(herb.name || item.herbName)}</h3>
                        <div class="category">${escapeHtml(herb.category)}</div>
                        <p><b>${t.functions}:</b> ${escapeHtml(herb.functions)}</p>
                        <p><b>${t.usage}:</b> ${escapeHtml(herb.usage)}</p>
                        <p><b>${t.precautions}:</b> ${escapeHtml(herb.precautions)}</p>
                        <p><b>${t.description}:</b> ${escapeHtml(herb.description)}</p>
                        <button class="remove-btn" data-herb-name="${escapeHtml(item.herbName)}">${t.remove}</button>
                    </div>
                </div>
            `;
        }).join("");

        const list = document.getElementById("favoriteList");
        list.innerHTML = html;
        list.querySelectorAll(".remove-btn").forEach(button => {
            button.addEventListener("click", () => removeFavorite(button.dataset.herbName));
        });
    }

    function removeFavorite(herbName){

        fetch(
            "/favorite/remove"
            + "?username=" + encodeURIComponent(username)
            + "&herbName=" + encodeURIComponent(herbName),
            {
                method:"DELETE"
            }
        )
            .then(response => {
                if(!response.ok) throw new Error("Failed to remove favorite: " + response.status);
                loadFavorites();
            })
            .catch(error => {
                console.error(error);
                alert(translations[currentLanguage].removeFailed);
            });
    }

    function changeLanguage(){

        currentLanguage = document.getElementById("languageSelect").value;
        localStorage.setItem("language", currentLanguage);
        applyLanguage();

    }

    function goHome(){
        window.location.href = "home.html";
    }

    function logout(){

        localStorage.clear();

        window.location.href = "login.html";

    }

</script>
