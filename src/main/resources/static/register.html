<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Register - TCM Cultural Popular Science System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                    linear-gradient(rgba(240,248,243,0.72), rgba(240,248,243,0.72)),
                    url("images/tcm-bg.jpg");
            background-size: cover;
            background-position: center;
            transition: 0.4s;
        }

        body.dark {
            background:
                    linear-gradient(rgba(10,25,20,0.78), rgba(10,25,20,0.78)),
                    url("images/tcm-bg.jpg");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .card {
            width: 430px;
            background: rgba(255,255,255,0.92);
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
            animation: fadeIn 0.8s ease;
        }

        body.dark .card {
            background: rgba(25,35,32,0.92);
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #2f5d50;
            margin-bottom: 5px;
        }

        body.dark h1 {
            color: #9ee0c5;
        }

        .subtitle, .system-name {
            text-align: center;
            color: #666;
        }

        body.dark .subtitle,
        body.dark .system-name {
            color: #cfded8;
        }

        .system-name {
            font-size: 13px;
            margin: 10px 0 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2f7d68, #3f9b82);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(47,125,104,0.4);
        }

        .mode-btn {
            background: transparent;
            border: 1px solid #2f7d68;
            color: #2f7d68;
            margin-top: 0;
            padding: 8px;
            font-size: 14px;
        }

        body.dark .mode-btn {
            color: #9ee0c5;
            border-color: #9ee0c5;
        }

        .link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .link a {
            color: #2f5d50;
            font-weight: bold;
            text-decoration: none;
        }

        body.dark .link a {
            color: #9ee0c5;
        }

        #result {
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
            color: #2f5d50;
        }

        body.dark #result {
            color: #9ee0c5;
        }
    </style>
</head>

<body>

<div class="card">
    <button class="mode-btn" onclick="toggleDarkMode()">🌗 Toggle Dark Mode</button>

    <h1>Register</h1>
    <div class="subtitle">User Registration Dashboard</div>
    <div class="system-name">TCM Cultural Popular Science System</div>

    <label>Username</label>
    <input type="text" id="username" placeholder="Enter your username">

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Confirm password">

    <button onclick="registerUser()">Register</button>

    <div class="link">
        Already have an account? <a href="login.html">Login here</a>
    </div>

    <div id="result"></div>
</div>

<script>
    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
        localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    }

    async function registerUser() {
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const result = document.getElementById("result");

        if (!username || !email || !password || !confirmPassword) {
            result.innerText = "Please fill in all fields.";
            return;
        }

        if (password !== confirmPassword) {
            result.innerText = "Passwords do not match.";
            return;
        }

        try {
            const response = await fetch("/user/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password, email})
            });

            const data = await response.json();
            result.innerText = data.message;

            if (data.message === "注册成功") {
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            }
        } catch (error) {
            result.innerText = "Registration failed.";
        }
    }
</script>

</body>
</html>
