<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCM Herb Information</title>
  <style>
    :root{--green:#2f5d50;--light:#e7f0eb;--accent:#58a27d;--ink:#26332f;--muted:#6d7773}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f4f6f2;color:var(--ink)}
    .header{background:var(--green);color:#fff;padding:18px clamp(20px,5vw,60px);display:flex;justify-content:space-between;align-items:center;gap:20px}
    #welcomeUser{font-size:22px;font-weight:700}.header-right{display:flex;align-items:center;gap:14px}.header select,.header button{height:42px;border:0;border-radius:9px;padding:0 16px;font-size:15px}.logout-btn{background:#fff;color:var(--green);font-weight:700;cursor:pointer}
    .navbar{min-height:65px;background:#fff;display:flex;justify-content:center;align-items:center;gap:clamp(18px,4vw,55px);padding:12px 20px;box-shadow:0 2px 8px #00000014;flex-wrap:wrap}.navbar a{text-decoration:none;color:var(--green);font-weight:700}.navbar .active{color:var(--accent);border-bottom:3px solid var(--accent);padding-bottom:6px}
    .container{width:min(1200px,calc(100% - 32px));margin:40px auto 60px}.hero{background:linear-gradient(135deg,var(--green),#47796b);color:#fff;padding:clamp(32px,5vw,56px);border-radius:20px;box-shadow:0 8px 22px #0000001f}.hero h1{margin:0;font-size:clamp(28px,4vw,36px)}.hero p{max-width:900px;line-height:1.8;margin:16px 0 0;color:#f4f8f6}
    .search-box{background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 18px #00000014;margin:28px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search-box input{flex:1;min-width:220px;height:50px;padding:0 16px;border:1px solid #d9dfdc;border-radius:10px;font-size:16px}.search-box button{height:50px;padding:0 20px;border:0;border-radius:10px;background:#2f7d68;color:#fff;font-weight:700;cursor:pointer}.search-box .secondary{background:#e7f0eb;color:var(--green)}.search-box button:disabled{opacity:.55;cursor:wait}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 18px;gap:12px}.result-info{color:var(--muted)}.source-note{font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.herb-card{background:#fff;border-radius:20px;overflow:hidden;display:flex;position:relative;box-shadow:0 8px 20px #00000014;transition:.25s;min-height:330px}.herb-card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #0000001f}.image-wrap{width:180px;flex:0 0 180px;background:linear-gradient(145deg,#d8e8df,#f2ead6);display:flex;align-items:center;justify-content:center;overflow:hidden}.herb-img{width:100%;height:100%;object-fit:cover}.image-placeholder{font-size:64px}.herb-content{min-width:0;flex:1;padding:24px;display:flex;flex-direction:column}.herb-content h2{margin:0 90px 4px 0;color:var(--green);font-size:25px}.latin-name{color:var(--muted);font-style:italic;margin:3px 0 12px}.category{align-self:flex-start;background:var(--light);color:var(--green);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:10px}.herb-content p{line-height:1.65;color:#4c5753;margin:6px 0}.label{color:var(--green);font-weight:700}.favorite-btn{position:absolute;top:20px;right:20px;background:#fff4c8;color:#956b00;border:0;padding:9px 13px;border-radius:22px;cursor:pointer;font-weight:700}.source-link{margin-top:auto;padding-top:12px;color:#2f705e;font-weight:700;text-decoration:none}.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:17px;padding:48px;background:#fff;border-radius:16px}.notice{margin-top:36px;background:#fff;border-left:5px solid #2f7d68;padding:20px 24px;border-radius:14px;box-shadow:0 5px 15px #0000000f;color:#555;line-height:1.7}
    @media(max-width:850px){.grid{grid-template-columns:1fr}}@media(max-width:560px){.herb-card{display:block}.image-wrap{width:100%;height:210px}.header{align-items:flex-start;flex-direction:column}.herb-content h2{margin-right:75px}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
  <link rel="stylesheet" href="css/guofeng-background.css?v=20260717-1">
</head>
<body>
  <header class="header"><span id="welcomeUser"></span><div class="header-right"><select id="languageSelect" aria-label="Language"><option value="en">English</option><option value="zh">中文</option><option value="ms">Bahasa Melayu</option></select><button class="logout-btn" id="logoutBtn">Logout</button></div></header>
  <nav class="navbar"><a href="home.html" data-nav="home">Home</a><a href="herb.html" class="active" data-nav="herbs">Herb Information</a><a href="quiz.html" data-nav="quiz">Knowledge Quiz</a><a href="history.html" data-nav="history">History</a><a href="personal_center.html" data-nav="profile">Personal Center</a></nav>
  <main class="container">
    <section class="hero"><h1 id="introTitle"></h1><p id="introText"></p></section>
    <section class="search-box" aria-label="Herb search"><input id="keyword" type="search"><button id="searchBtn"></button><button id="externalBtn"></button><button id="showAllBtn" class="secondary"></button></section>
    <div class="toolbar"><span id="resultInfo" class="result-info"></span><span id="sourceNote" class="source-note"></span></div>
    <section id="herbList" class="grid" aria-live="polite"></section>
    <aside class="notice"><strong id="noticeTitle"></strong><span id="noticeText"></span></aside>
  </main>
<script>
  const username=localStorage.getItem('username');
  if(!username){alert('Please login first.');location.href='login.html'}
  const API_BASE='';
  let currentLanguage=localStorage.getItem('language')||'en';
  let catalog=[],currentHerbs=[],favoriteHerbs=[];
  const ui={
    en:{welcome:'Welcome',logout:'Logout',home:'Home',herbs:'Herb Information',quiz:'Knowledge Quiz',history:'History',profile:'Personal Center',title:'Traditional Chinese Medicine Herb Information',intro:'Explore a curated trilingual herb library, or search a public reference source. All information is for cultural and educational use.',placeholder:'Search by name, e.g. Ginseng / 人参',search:'Search library',external:'Search external source',searching:'Searching…',all:'Show all',functions:'Traditional functions',usage:'Common presentation',precautions:'Precautions',description:'Description',favorite:'☆ Favorite',favorited:'★ Favorited',source:'View source',localSource:'Curated local library',externalSource:'External results from Wikipedia',results:n=>`${n} result${n===1?'':'s'}`,none:'No herb information found.',failed:'Unable to load herb information.',externalFailed:'The external source is temporarily unavailable.',noticeTitle:'Notice: ',notice:'This content is for cultural learning and general education only. It is not medical diagnosis or treatment advice. Consult a qualified healthcare professional for health decisions.'},
    zh:{welcome:'欢迎',logout:'退出登录',home:'首页',herbs:'草药信息',quiz:'知识测验',history:'历史记录',profile:'个人中心',title:'中医药草药信息',intro:'浏览经过整理的三语草药资料库，也可查询公开参考来源。所有信息仅供文化学习与科普教育。',placeholder:'按名称搜索，例如：人参 / Ginseng',search:'搜索资料库',external:'搜索外部资料',searching:'正在搜索…',all:'显示全部',functions:'传统功效',usage:'常见用法',precautions:'注意事项',description:'简介',favorite:'☆ 收藏',favorited:'★ 已收藏',source:'查看资料来源',localSource:'本地精选资料库',externalSource:'外部结果来自维基百科',results:n=>`共 ${n} 条结果`,none:'未找到相关草药信息。',failed:'草药信息加载失败。',externalFailed:'外部资料源暂时无法访问。',noticeTitle:'提示：',notice:'本页内容仅供中医药文化学习和科普教育，不构成医学诊断或治疗建议。健康相关决定请咨询合格的医疗专业人士。'},
    ms:{welcome:'Selamat Datang',logout:'Log Keluar',home:'Laman Utama',herbs:'Maklumat Herba',quiz:'Kuiz Pengetahuan',history:'Sejarah',profile:'Pusat Peribadi',title:'Maklumat Herba Perubatan Tradisional Cina',intro:'Terokai pustaka herba tiga bahasa yang disusun, atau cari sumber rujukan awam. Semua maklumat adalah untuk budaya dan pendidikan.',placeholder:'Cari nama, contoh: Ginseng / 人参',search:'Cari pustaka',external:'Cari sumber luar',searching:'Mencari…',all:'Papar semua',functions:'Fungsi tradisional',usage:'Penggunaan lazim',precautions:'Langkah berjaga-jaga',description:'Penerangan',favorite:'☆ Kegemaran',favorited:'★ Disimpan',source:'Lihat sumber',localSource:'Pustaka tempatan pilihan',externalSource:'Hasil luar daripada Wikipedia',results:n=>`${n} hasil`,none:'Tiada maklumat herba dijumpai.',failed:'Gagal memuatkan maklumat herba.',externalFailed:'Sumber luar tidak dapat dicapai buat sementara.',noticeTitle:'Notis: ',notice:'Kandungan ini hanya untuk pembelajaran budaya dan pendidikan umum. Ia bukan diagnosis atau nasihat rawatan. Rujuk profesional kesihatan yang berkelayakan untuk keputusan kesihatan.'}
  };
  const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function localize(item){const text=item.translations?.[currentLanguage]||item.translations?.en||{};return{...text,id:item.id,latinName:item.latinName,image:item.image,originalName:item.translations?.zh?.name||text.name,external:false}}
  function applyLanguage(){const t=ui[currentLanguage];document.documentElement.lang=currentLanguage;document.title=t.herbs;welcomeUser.textContent=`👋 ${t.welcome}, ${username}`;logoutBtn.textContent=t.logout;introTitle.textContent=t.title;introText.textContent=t.intro;keyword.placeholder=t.placeholder;searchBtn.textContent=t.search;externalBtn.textContent=t.external;showAllBtn.textContent=t.all;noticeTitle.textContent=t.noticeTitle;noticeText.textContent=t.notice;document.querySelectorAll('[data-nav]').forEach(a=>a.textContent=t[a.dataset.nav]);if(currentHerbs.length)render(currentHerbs)}
  function render(items,source='local'){const t=ui[currentLanguage];currentHerbs=items;herbList.innerHTML='';resultInfo.textContent=t.results(items.length);sourceNote.textContent=source==='external'?t.externalSource:t.localSource;if(!items.length){herbList.innerHTML=`<div class="empty">${esc(t.none)}</div>`;return}for(const herb of items){const key=herb.originalName||herb.name;const favorite=favoriteHerbs.includes(key);const card=document.createElement('article');card.className='herb-card';card.innerHTML=`<div class="image-wrap">${herb.image?`<img class="herb-img" src="${esc(herb.image)}" alt="${esc(herb.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;image-placeholder&quot;>🌿</span>'">`:'<span class="image-placeholder">🌿</span>'}</div><div class="herb-content"><h2>${esc(herb.name)}</h2><button class="favorite-btn" data-key="${esc(key)}">${favorite?t.favorited:t.favorite}</button>${herb.latinName?`<div class="latin-name">${esc(herb.latinName)}</div>`:''}<span class="category">${esc(herb.category||'TCM Herb')}</span>${herb.functions?`<p><span class="label">${t.functions}: </span>${esc(herb.functions)}</p>`:''}${herb.usage?`<p><span class="label">${t.usage}: </span>${esc(herb.usage)}</p>`:''}${herb.precautions?`<p><span class="label">${t.precautions}: </span>${esc(herb.precautions)}</p>`:''}<p><span class="label">${t.description}: </span>${esc(herb.description||'')}</p>${herb.sourceUrl?`<a class="source-link" href="${esc(herb.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t.source} ↗</a>`:''}</div>`;card.querySelector('.favorite-btn').addEventListener('click',()=>toggleFavorite(key));herbList.appendChild(card)}}
  function showAll(){keyword.value='';render(catalog.map(localize))}
  function searchLocal(){const q=keyword.value.trim().toLocaleLowerCase();if(!q)return showAll();const results=catalog.filter(h=>[h.latinName,...Object.values(h.translations).flatMap(x=>[x.name,x.category,x.description])].join(' ').toLocaleLowerCase().includes(q)).map(localize);render(results)}
  async function searchExternal(){const q=keyword.value.trim();if(!q){keyword.focus();return}const t=ui[currentLanguage];externalBtn.disabled=true;externalBtn.textContent=t.searching;try{const response=await fetch(`${API_BASE}/herb/external/search?keyword=${encodeURIComponent(q)}&lang=${encodeURIComponent(currentLanguage)}`);if(!response.ok)throw new Error(response.status);const data=await response.json();render(data.map(x=>({name:x.name,originalName:x.name,image:x.image,category:'Wikipedia',description:x.description,sourceUrl:x.sourceUrl,external:true})),'external')}catch(error){console.error(error);herbList.innerHTML=`<div class="empty">${esc(t.externalFailed)}</div>`;resultInfo.textContent='';sourceNote.textContent=t.externalSource}finally{externalBtn.disabled=false;externalBtn.textContent=t.external}}
  async function loadFavorites(){try{const r=await fetch(`${API_BASE}/favorite/list?username=${encodeURIComponent(username)}`);if(r.ok)favoriteHerbs=(await r.json()).map(x=>x.herbName)}catch(e){console.warn('Favorites unavailable',e)}}
  async function toggleFavorite(key){const exists=favoriteHerbs.includes(key);try{const url=exists?`${API_BASE}/favorite/remove?username=${encodeURIComponent(username)}&herbName=${encodeURIComponent(key)}`:`${API_BASE}/favorite/add`;const options=exists?{method:'DELETE'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,herbName:key})};const r=await fetch(url,options);if(!r.ok)throw new Error(r.status);favoriteHerbs=exists?favoriteHerbs.filter(x=>x!==key):[...favoriteHerbs,key];render(currentHerbs,sourceNote.textContent===ui[currentLanguage].externalSource?'external':'local')}catch(e){console.error(e);alert(currentLanguage==='zh'?'收藏操作失败，请稍后重试。':currentLanguage==='ms'?'Operasi kegemaran gagal. Sila cuba lagi.':'Favorite operation failed. Please try again.')}}
  async function init(){languageSelect.value=currentLanguage;applyLanguage();try{const response=await fetch('/data/herbs.json?v=20260701-2',{cache:'no-store'});if(!response.ok)throw new Error(response.status);catalog=await response.json();await loadFavorites();showAll()}catch(e){console.error(e);herbList.innerHTML=`<div class="empty">${esc(ui[currentLanguage].failed)}</div>`}}
  languageSelect.addEventListener('change',()=>{currentLanguage=languageSelect.value;localStorage.setItem('language',currentLanguage);applyLanguage();if(!currentHerbs.some(x=>x.external))searchLocal()});logoutBtn.addEventListener('click',()=>{localStorage.removeItem('username');location.href='login.html'});searchBtn.addEventListener('click',searchLocal);externalBtn.addEventListener('click',searchExternal);showAllBtn.addEventListener('click',showAll);keyword.addEventListener('keydown',e=>{if(e.key==='Enter')searchLocal()});init();
</script>
<script src="/js/user-avatar.js?v=20260702-1"></script>
</body>
</html>
