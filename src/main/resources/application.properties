spring.application.name=TCM-app
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tcm_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:tcm_user}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.avatar.upload-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
